name: Publish sidecar image

# The connector sidecar (Dockerfile) for backends in any language:
# ghcr.io/tek-juice/tekjuice-connector:<version> and :latest.
on:
  release:
    types: [published]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tek-juice/tekjuice-connector:${{ steps.version.outputs.version }}
            ghcr.io/tek-juice/tekjuice-connector:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Tek Juice connector sidecar: S2S publication for backends in any language
            org.opencontainers.image.licenses=MIT
